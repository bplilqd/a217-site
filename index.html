<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Записаться в автосервис</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #17191c;
            color: #f1f3f5;
            font-family: system-ui, sans-serif;
        }

        /* Центральный контейнер */
        .button-center {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Графитовая кнопка */
        .btn-graphite {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 15px 42px;

            color: #f1f3f5;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: .4px;

            background: linear-gradient(
                145deg,
                #454a50,
                #292d32 55%,
                #202328
            );

            border: 1px solid #555b63;
            border-radius: 10px;

            box-shadow:
                0 5px 12px rgba(0,0,0,.35),
                inset 0 1px 1px rgba(255,255,255,.16),
                inset 0 -2px 3px rgba(0,0,0,.3);

            text-decoration: none;
            cursor: pointer;

            transition:
                background .18s ease,
                box-shadow .18s ease,
                transform .18s ease,
                border-color .18s ease;
        }

        /* Наведение */
        .btn-graphite:hover {
            color: #fff;

            background: linear-gradient(
                145deg,
                #535961,
                #30353b
            );

            border-color: #747b84;

            box-shadow:
                0 7px 18px rgba(0,0,0,.4),
                inset 0 1px 1px rgba(255,255,255,.2);

            transform: translateY(-2px);
        }

        /* Нажатие */
        .btn-graphite:active {
            color: #fff;
            transform: translateY(2px);

            box-shadow:
                inset 0 3px 7px rgba(0,0,0,.5),
                0 1px 2px rgba(0,0,0,.3);
        }

        /* Фокус клавиатуры */
        .btn-graphite:focus-visible {
            outline: 3px solid #929ba5;
            outline-offset: 4px;
        }

        /* Мобильная версия */
        @media (hover: none) {
            .btn-graphite:hover {
                transform: none;
            }

            .btn-graphite:active {
                background: #202429;
                transform: scale(.97);

                box-shadow:
                    inset 0 3px 8px rgba(0,0,0,.6);
            }
        }

        /* Адаптация под узкие экраны */
        @media (max-width: 480px) {
            .btn-graphite {
                width: 100%;
                max-width: 320px;
                padding: 17px 25px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
<script type="text/javascript" src="https://dikidi.ru/assets/js/widget_record/widget2.min.js?v=1825777749"></script>

    <main class="button-center">

        <a href="https://dikidi.ru/#widget=192778" class="btn-graphite">
            <span>Записаться (выбрать услугу)</span>
            <span aria-hidden="true">→</span>
        </a>

    </main>

</body>
</html>
